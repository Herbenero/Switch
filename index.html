<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Switch Tourney</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card);
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }
    h1, h2, h3 { text-align: center; margin-top: 0; }
    .mode-selection {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .mode-btn {
      flex: 1;
      padding: 0.75rem;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .mode-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .setup-row {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    .rounds-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #0f172a;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      white-space: nowrap;
    }
    .rounds-group label {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: bold;
    }
    select {
      background: var(--card);
      color: white;
      border: 1px solid var(--border);
      padding: 0.4rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: white;
    }
    button.action-btn {
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }
    button.action-btn:hover { background: var(--accent-hover); }
    button.submit-btn {
      background: var(--success);
      margin-top: 0.5rem;
    }
    button.submit-btn:hover { background: #16a34a; }
    ul { list-style: none; padding: 0; margin-bottom: 1.5rem; }
    li {
      background: #0f172a;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .remove-btn {
      background: transparent;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-weight: bold;
    }
    .matches-container, .leaderboard-container {
      margin-top: 2rem;
    }
    .match-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    .match-card.completed {
      border-color: var(--success);
      opacity: 0.9;
    }
    .team-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0.5rem 0;
      padding: 0.5rem;
      background: #1e293b;
      border-radius: 4px;
    }
    .score-inputs {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .score-input {
      width: 50px !important;
      padding: 0.4rem !important;
      text-align: center;
    }
    .vs { color: var(--accent); font-weight: bold; margin: 0.25rem 0; }
    .bye { color: var(--text-muted); font-style: italic; }
    .save-score-btn {
      background: #334155;
      color: white;
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .save-score-btn:hover {
      background: var(--accent);
    }
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      background: #0f172a;
      border-radius: 8px;
      overflow: hidden;
    }
    .leaderboard-table th, .leaderboard-table td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .leaderboard-table th {
      background: #1e293b;
      color: var(--text-muted);
      font-weight: bold;
    }
    .tournament-complete {
      text-align: center;
      background: #0f172a;
      border: 1px solid var(--success);
      padding: 1.5rem;
      border-radius: 8px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Switch Tournament</h1>
  
  <div class="mode-selection">
    <button class="mode-btn active" id="singles-btn" onclick="setMode('singles')">Singles (1v1)</button>
    <button class="mode-btn" id="doubles-btn" onclick="setMode('doubles')">Doubles (2v2)</button>
  </div>

  <div class="setup-row">
    <div class="rounds-group">
      <label for="rounds-select">Rounds to Play:</label>
      <select id="rounds-select">
        <!-- Options 1 to 20 populated dynamically -->
      </select>
    </div>
  </div>

  <div class="input-group">
    <input type="text" id="player-input" placeholder="Enter player name" onkeydown="if(event.key==='Enter') addPlayer()">
    <button class="action-btn" style="width: auto;" onclick="addPlayer()">Add</button>
  </div>

  <ul id="player-list"></ul>

  <button class="action-btn" onclick="startEvent()">Start Event</button>

  <div class="leaderboard-container" id="leaderboard-section" style="display: none;">
    <h2>🏆 Leaderboard</h2>
    <table class="leaderboard-table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Player</th>
          <th>Wins</th>
          <th>Pts Scored</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>
  </div>

  <div class="matches-container" id="matches-section" style="display: none;">
    <h2 id="round-header">Round 1 Matchups</h2>
    <div id="match-list"></div>
    <button class="action-btn submit-btn" id="next-round-btn" onclick="handleNextRound()" style="display: none;">Generate Next Round</button>
  </div>
</div>

<script>
  let players = [];
  let mode = 'singles';
  let matchHistory = new Set();
  let currentMatches = [];
  let currentRound = 1;
  let totalRounds = 5;

  // Stats tracking for Leaderboard
  let playerStats = {};

  const roundsSelect = document.getElementById('rounds-select');
  for (let i = 1; i <= 20; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = i;
    if (i === 5) opt.selected = true;
    roundsSelect.appendChild(opt);
  }

  function setMode(selectedMode) {
    mode = selectedMode;
    document.getElementById('singles-btn').classList.toggle('active', mode === 'singles');
    document.getElementById('doubles-btn').classList.toggle('active', mode === 'doubles');
    resetStats();
  }

  function addPlayer() {
    const input = document.getElementById('player-input');
    const name = input.value.trim();
    if (name && !players.includes(name)) {
      players.push(name);
      input.value = '';
      renderPlayers();
    }
  }

  function removePlayer(name) {
    players = players.filter(p => p !== name);
    renderPlayers();
  }

  function renderPlayers() {
    const list = document.getElementById('player-list');
    list.innerHTML = players.map(p => 
      `<li>${p} <button class="remove-btn" onclick="removePlayer('${p}')">✕</button></li>`
    ).join('');
  }

  function shuffle(array) {
    return [...array].sort(() => Math.random() - 0.5);
  }

  function getMatchKey(teamA, teamB) {
    const a = [...teamA].sort().join('&');
    const b = [...teamB].sort().join('&');
    return [a, b].sort().join(' VS ');
  }

  function resetStats() {
    matchHistory.clear();
    currentRound = 1;
    playerStats = {};
    players.forEach(p => {
      playerStats[p] = { wins: 0, points: 0 };
    });
  }

  function startEvent() {
    const minPlayers = mode === 'singles' ? 2 : 4;
    if (players.length < minPlayers) {
      alert(`You need at least ${minPlayers} players for ${mode}.`);
      return;
    }
    totalRounds = parseInt(document.getElementById('rounds-select').value, 10);
    resetStats();
    document.getElementById('leaderboard-section').style.display = 'block';
    renderLeaderboard();
    generateNextRound();
  }

  function generateNextRound() {
    const teamSize = mode === 'singles' ? 1 : 2;
    let availablePlayers = shuffle(players);
    let teams = [];

    while (availablePlayers.length >= teamSize) {
      teams.push(availablePlayers.splice(0, teamSize));
    }
    
    let byePlayer = availablePlayers.length > 0 ? availablePlayers[0] : null;

    let possiblePairs = [];
    for (let i = 0; i < teams.length; i++) {
      for (let j = i + 1; j < teams.length; j++) {
        possiblePairs.push([teams[i], teams[j]]);
      }
    }

    let freshPairs = possiblePairs.filter(pair => !matchHistory.has(getMatchKey(pair[0], pair[1])));

    if (freshPairs.length === 0) {
      matchHistory.clear();
      freshPairs = possiblePairs;
    }

    let matches = [];
    let usedTeams = new Set();
    freshPairs = shuffle(freshPairs);

    for (let [teamA, teamB] of freshPairs) {
      const keyA = teamA.join(',');
      const keyB = teamB.join(',');
      if (!usedTeams.has(keyA) && !usedTeams.has(keyB)) {
        matches.push({ teamA, teamB, scoreA: '', scoreB: '', submitted: false });
        usedTeams.add(keyA);
        usedTeams.add(keyB);
        matchHistory.add(getMatchKey(teamA, teamB));
      }
    }

    currentMatches = matches;
    renderMatches(byePlayer);
  }

  function submitScore(matchIndex) {
    const inputA = document.getElementById(`score-a-${matchIndex}`);
    const inputB = document.getElementById(`score-b-${matchIndex}`);
    const valA = parseInt(inputA.value, 10);
    const valB = parseInt(inputB.value, 10);

    if (isNaN(valA) || isNaN(valB)) {
      alert("Please enter numeric scores for both teams.");
      return;
    }

    const match = currentMatches[matchIndex];
    match.scoreA = valA;
    match.scoreB = valB;
    match.submitted = true;

    // Award points to individual players
    match.teamA.forEach(p => {
      playerStats[p].points += valA;
      if (valA > valB) playerStats[p].wins += 1;
    });

    match.teamB.forEach(p => {
      playerStats[p].points += valB;
      if (valB > valA) playerStats[p].wins += 1;
    });

    renderLeaderboard();
    renderMatches();
  }

  function renderLeaderboard() {
    const body = document.getElementById('leaderboard-body');
    const sorted = Object.keys(playerStats)
      .map(p => ({ name: p, ...playerStats[p] }))
      .sort((a, b) => b.wins - a.wins || b.points - a.points);

    body.innerHTML = sorted.map((p, idx) => `
      <tr>
        <td>#${idx + 1}</td>
        <td><strong>${p.name}</strong></td>
        <td>${p.wins}</td>
        <td>${p.points}</td>
      </tr>
    `).join('');
  }

  function handleNextRound() {
    if (currentRound < totalRounds) {
      currentRound++;
      generateNextRound();
    } else {
      renderTournamentComplete();
    }
  }

  function renderMatches(byePlayer = null) {
    const container = document.getElementById('matches-section');
    const list = document.getElementById('match-list');
    const nextBtn = document.getElementById('next-round-btn');
    
    document.getElementById('round-header').innerText = `Round ${currentRound} of ${totalRounds} Matchups`;
    container.style.display = 'block';

    list.innerHTML = currentMatches.map((m, index) => {
      return `
        <div class="match-card ${m.submitted ? 'completed' : ''}">
          <div><strong>Match ${index + 1}</strong></div>
          
          <div class="team-row">
            <span>${m.teamA.join(' & ')}</span>
            <input type="number" id="score-a-${index}" class="score-input" value="${m.scoreA}" ${m.submitted ? 'disabled' : ''} min="0">
          </div>

          <div class="vs">VS</div>

          <div class="team-row">
            <span>${m.teamB.join(' & ')}</span>
            <input type="number" id="score-b-${index}" class="score-input" value="${m.scoreB}" ${m.submitted ? 'disabled' : ''} min="0">
          </div>

          ${!m.submitted ? `<button class="save-score-btn" onclick="submitScore(${index})">Submit Score</button>` : `<span style="color: var(--success); font-weight: bold;">Score Recorded</span>`}
        </div>
      `;
    }).join('');

    if (byePlayer) {
      list.innerHTML += `
        <div class="match-card bye">
          <strong>BYE (No Match):</strong> ${byePlayer}
        </div>
      `;
    }

    const allCompleted = currentMatches.length > 0 && currentMatches.every(m => m.submitted);
    nextBtn.style.display = allCompleted ? 'block' : 'none';
    nextBtn.innerText = (currentRound === totalRounds) ? 'Finish Tournament' : 'Generate Next Round';
  }

  function renderTournamentComplete() {
    const list = document.getElementById('match-list');
    const nextBtn = document.getElementById('next-round-btn');
    document.getElementById('round-header').innerText = 'Tournament Complete!';

    list.innerHTML = `
      <div class="tournament-complete">
        <h3>🎉 All ${totalRounds} rounds completed!</h3>
        <p>Check the leaderboard above for the final rankings!</p>
      </div>
    `;
    nextBtn.style.display = 'none';
  }
</script>

</body>
</html>
