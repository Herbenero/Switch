<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament Generator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }
    h1, h2 { text-align: center; margin-top: 0; }
    .mode-selection {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .mode-btn {
      flex: 1;
      padding: 0.75rem;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .mode-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    input {
      flex: 1;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: white;
    }
    button.action-btn {
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }
    button.action-btn:hover { background: var(--accent-hover); }
    ul { list-style: none; padding: 0; margin-bottom: 1.5rem; }
    li {
      background: #0f172a;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .remove-btn {
      background: transparent;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-weight: bold;
    }
    .matches-container {
      margin-top: 2rem;
    }
    .match-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    .vs { color: var(--accent); font-weight: bold; margin: 0.5rem 0; }
    .bye { color: var(--text-muted); font-style: italic; }
  </style>
</head>
<body>

<div class="container">
  <h1>Tournament Setup</h1>
  
  <div class="mode-selection">
    <button class="mode-btn active" id="singles-btn" onclick="setMode('singles')">Singles (1v1)</button>
    <button class="mode-btn" id="doubles-btn" onclick="setMode('doubles')">Doubles (2v2)</button>
  </div>

  <div class="input-group">
    <input type="text" id="player-input" placeholder="Enter player name" onkeydown="if(event.key==='Enter') addPlayer()">
    <button class="action-btn" style="width: auto;" onclick="addPlayer()">Add</button>
  </div>

  <ul id="player-list"></ul>

  <button class="action-btn" onclick="startEvent()">Start Event</button>

  <div class="matches-container" id="matches-section" style="display: none;">
    <h2>Matchups</h2>
    <div id="match-list"></div>
  </div>
</div>

<script>
  let players = [];
  let mode = 'singles';
  let matchHistory = new Set(); // Tracks previously played matchups

  function setMode(selectedMode) {
    mode = selectedMode;
    document.getElementById('singles-btn').classList.toggle('active', mode === 'singles');
    document.getElementById('doubles-btn').classList.toggle('active', mode === 'doubles');
    matchHistory.clear(); // Reset history when changing mode
  }

  function addPlayer() {
    const input = document.getElementById('player-input');
    const name = input.value.trim();
    if (name && !players.includes(name)) {
      players.push(name);
      input.value = '';
      renderPlayers();
    }
  }

  function removePlayer(name) {
    players = players.filter(p => p !== name);
    renderPlayers();
  }

  function renderPlayers() {
    const list = document.getElementById('player-list');
    list.innerHTML = players.map(p => 
      `<li>${p} <button class="remove-btn" onclick="removePlayer('${p}')">✕</button></li>`
    ).join('');
  }

  function shuffle(array) {
    return [...array].sort(() => Math.random() - 0.5);
  }

  function getMatchKey(teamA, teamB) {
    const a = teamA.sort().join('&');
    const b = teamB.sort().join('&');
    return [a, b].sort().join(' VS ');
  }

  function startEvent() {
    const minPlayers = mode === 'singles' ? 2 : 4;
    if (players.length < minPlayers) {
      alert(`You need at least ${minPlayers} players for ${mode}.`);
      return;
    }

    const teamSize = mode === 'singles' ? 1 : 2;
    let availablePlayers = shuffle(players);
    let teams = [];

    // Form teams
    while (availablePlayers.length >= teamSize) {
      teams.push(availablePlayers.splice(0, teamSize));
    }
    
    // Handle remaining player for odd numbers in singles
    let byePlayer = availablePlayers.length > 0 ? availablePlayers[0] : null;

    let possiblePairs = [];
    for (let i = 0; i < teams.length; i++) {
      for (let j = i + 1; j < teams.length; j++) {
        possiblePairs.push([teams[i], teams[j]]);
      }
    }

    // Filter out previously played matches
    let freshPairs = possiblePairs.filter(pair => !matchHistory.has(getMatchKey(pair[0], pair[1])));

    // If all matchups have occurred, reset history and use all options
    if (freshPairs.length === 0) {
      matchHistory.clear();
      freshPairs = possiblePairs;
    }

    // Create matches ensuring each team only plays once per round
    let matches = [];
    let usedTeams = new Set();
    freshPairs = shuffle(freshPairs);

    for (let [teamA, teamB] of freshPairs) {
      const keyA = teamA.join(',');
      const keyB = teamB.join(',');
      if (!usedTeams.has(keyA) && !usedTeams.has(keyB)) {
        matches.push([teamA, teamB]);
        usedTeams.add(keyA);
        usedTeams.add(keyB);
        matchHistory.add(getMatchKey(teamA, teamB));
      }
    }

    renderMatches(matches, byePlayer);
  }

  function renderMatches(matches, byePlayer) {
    const container = document.getElementById('matches-section');
    const list = document.getElementById('match-list');
    container.style.display = 'block';

    let html = matches.map((m, index) => `
      <div class="match-card">
        <div><strong>Match ${index + 1}</strong></div>
        <div>${m[0].join(' & ')}</div>
        <div class="vs">VS</div>
        <div>${m[1].join(' & ')}</div>
      </div>
    `).join('');

    if (byePlayer) {
      html += `
        <div class="match-card bye">
          <strong>BYE (No Match):</strong> ${byePlayer}
        </div>
      `;
    }

    list.innerHTML = html;
  }
</script>

</body>
</html>
