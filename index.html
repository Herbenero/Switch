<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Switch Tourney</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card);
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }
    h1, h2, h3 {
      text-align: center;
      margin-top: 0;
    }
    .mode-selection {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .mode-btn {
      flex: 1;
      padding: 0.75rem;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .mode-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .setup-row {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    .rounds-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #0f172a;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      white-space: nowrap;
      width: 100%;
      justify-content: space-between;
    }
    .rounds-group label {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: bold;
    }
    .input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: white;
    }
    button.action-btn {
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }
    button.action-btn:hover {
      background: var(--accent-hover);
    }
    button.submit-btn {
      background: var(--success);
      margin-top: 0.5rem;
    }
    button.submit-btn:hover {
      background: #16a34a;
    }
    button.secondary-btn {
      background: #334155;
      margin-top: 1rem;
    }
    button.secondary-btn:hover {
      background: #475569;
    }
    ul {
      list-style: none;
      padding: 0;
      margin-bottom: 1.5rem;
    }
    li {
      background: #0f172a;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .remove-btn {
      background: transparent;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-weight: bold;
    }
    .matches-container, .leaderboard-container {
      margin-top: 2rem;
    }
    .match-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    .match-card.completed {
      border-color: var(--success);
      opacity: 0.9;
    }
    .team-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0.5rem 0;
      padding: 0.5rem;
      background: #1e293b;
      border-radius: 4px;
    }
    .score-input {
      width: 50px !important;
      padding: 0.4rem !important;
      text-align: center;
    }
    .vs {
      color: var(--accent);
      font-weight: bold;
      margin: 0.25rem 0;
    }
    .bye {
      color: var(--text-muted);
      font-style: italic;
      background: #0f172a;
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      text-align: center;
      border: 1px dashed var(--border);
    }
    .save-score-btn {
      background: #334155;
      color: white;
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .save-score-btn:hover {
      background: var(--accent);
    }
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      background: #0f172a;
      border-radius: 8px;
      overflow: hidden;
    }
    .leaderboard-table th, .leaderboard-table td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .leaderboard-table th {
      background: #1e293b;
      color: var(--text-muted);
      font-weight: bold;
    }
    .tournament-complete {
      text-align: center;
      background: #0f172a;
      border: 1px solid var(--success);
      padding: 1.5rem;
      border-radius: 8px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Switch Tournament</h1>

    <!-- Setup Container -->
    <div id="setup-section">
      <div class="mode-selection">
        <button class="mode-btn active" id="singles-btn" onclick="setMode('singles')">Singles (1v1)</button>
        <button class="mode-btn" id="doubles-btn" onclick="setMode('doubles')">Doubles (2v2)</button>
      </div>

      <div class="setup-row">
        <div class="rounds-group">
          <label>Target Games Per Player:</label>
          <span style="font-weight: bold; color: var(--accent);">4 Games</span>
        </div>
      </div>

      <div class="input-group">
        <input type="text" id="player-input" placeholder="Enter player name" onkeydown="if(event.key==='Enter') addPlayer()">
        <button class="action-btn" style="width: auto;" onclick="addPlayer()">Add</button>
      </div>

      <ul id="player-list"></ul>
      <button class="action-btn" onclick="startEvent()">Start Event</button>
    </div>

    <!-- Active Event Container -->
    <div class="leaderboard-container" id="leaderboard-section" style="display: none;">
      <h2>🏆 Leaderboard</h2>
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Games</th>
            <th>Wins</th>
            <th>Pts Scored</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
    </div>

    <div class="matches-container" id="matches-section" style="display: none;">
      <h2 id="round-header">Round 1 Matchups</h2>
      <div id="bye-display" class="bye" style="display: none;"></div>
      <div id="match-list"></div>
      <button class="action-btn submit-btn" id="next-round-btn" onclick="nextRound()">Next Round</button>
      <button class="action-btn secondary-btn" onclick="resetEvent()">Reset Tournament</button>
    </div>
  </div>

  <script>
    let mode = 'singles';
    let players = [];
    let currentRound = 1;
    let totalRounds = 4;
    let roundsData = [];
    let playerStats = {};

    function setMode(selectedMode) {
      mode = selectedMode;
      document.getElementById('singles-btn').classList.toggle('active', mode === 'singles');
      document.getElementById('doubles-btn').classList.toggle('active', mode === 'doubles');
    }

    function addPlayer() {
      const input = document.getElementById('player-input');
      const name = input.value.trim();
      if (name && !players.includes(name)) {
        players.push(name);
        input.value = '';
        renderPlayerList();
      }
    }

    function removePlayer(name) {
      players = players.filter(p => p !== name);
      renderPlayerList();
    }

    function renderPlayerList() {
      const list = document.getElementById('player-list');
      list.innerHTML = players.map(p => `
        <li>
          <span>${p}</span>
          <button class="remove-btn" onclick="removePlayer('${p}')">✕</button>
        </li>
      `).join('');
    }

    function startEvent() {
      if (players.length < (mode === 'singles' ? 2 : 4)) {
        alert(`Need at least ${mode === 'singles' ? 2 : 4} players to start.`);
        return;
      }

      // If odd number of players, require 5 rounds so everyone gets 1 bye and 4 games played
      const isOdd = players.length % 2 !== 0;
      totalRounds = isOdd ? 5 : 4;

      playerStats = {};
      players.forEach(p => {
        playerStats[p] = { wins: 0, points: 0, gamesPlayed: 0 };
      });

      currentRound = 1;
      generateSchedule();

      document.getElementById('setup-section').style.display = 'none';
      document.getElementById('leaderboard-section').style.display = 'block';
      document.getElementById('matches-section').style.display = 'block';

      renderLeaderboard();
      renderCurrentRound();
    }

    function generateSchedule() {
      roundsData = [];
      let playerPool = [...players];

      for (let r = 1; r <= totalRounds; r++) {
        let activePlayers = [...playerPool];
        let byePlayer = null;

        // Systematic rotation for odd players: 1 player gets a bye per round
        if (players.length % 2 !== 0) {
          const byeIndex = (r - 1) % players.length;
          byePlayer = players[byeIndex];
          activePlayers = activePlayers.filter(p => p !== byePlayer);
        }

        // Shuffle active players for pairings
        activePlayers.sort(() => Math.random() - 0.5);

        let matches = [];
        if (mode === 'singles') {
          for (let i = 0; i < activePlayers.length; i += 2) {
            if (i + 1 < activePlayers.length) {
              matches.push({
                team1: [activePlayers[i]],
                team2: [activePlayers[i + 1]],
                score1: null,
                score2: null,
                completed: false
              });
            }
          }
        } else {
          // Doubles
          for (let i = 0; i < activePlayers.length; i += 4) {
            if (i + 3 < activePlayers.length) {
              matches.push({
                team1: [activePlayers[i], activePlayers[i + 1]],
                team2: [activePlayers[i + 2], activePlayers[i + 3]],
                score1: null,
                score2: null,
                completed: false
              });
            }
          }
        }

        roundsData.push({
          round: r,
          bye: byePlayer,
          matches: matches
        });
      }
    }

    function renderCurrentRound() {
      const roundInfo = roundsData[currentRound - 1];
      document.getElementById('round-header').innerText = `Round ${currentRound} of ${totalRounds}`;

      const byeDisplay = document.getElementById('bye-display');
      if (roundInfo.bye) {
        byeDisplay.style.display = 'block';
        byeDisplay.innerText = `🛋️ Sitting out this round (Bye): ${roundInfo.bye}`;
      } else {
        byeDisplay.style.display = 'none';
      }

      const matchList = document.getElementById('match-list');
      matchList.innerHTML = roundInfo.matches.map((m, idx) => `
        <div class="match-card ${m.completed ? 'completed' : ''}">
          <div class="team-row">
            <span>${m.team1.join(' & ')}</span>
            <input type="number" class="score-input" id="score1-${idx}" value="${m.score1 !== null ? m.score1 : ''}" min="0">
          </div>
          <div class="vs">VS</div>
          <div class="team-row">
            <span>${m.team2.join(' & ')}</span>
            <input type="number" class="score-input" id="score2-${idx}" value="${m.score2 !== null ? m.score2 : ''}" min="0">
          </div>
          <button class="save-score-btn" onclick="saveScore(${idx})">${m.completed ? 'Update Score' : 'Save Score'}</button>
        </div>
      `).join('');

      const nextBtn = document.getElementById('next-round-btn');
      if (currentRound === totalRounds) {
        nextBtn.innerText = 'Complete Tournament';
      } else {
        nextBtn.innerText = 'Next Round';
      }
    }

    function saveScore(matchIdx) {
      const score1 = parseInt(document.getElementById(`score1-${matchIdx}`).value);
      const score2 = parseInt(document.getElementById(`score2-${matchIdx}`).value);

      if (isNaN(score1) || isNaN(score2)) {
        alert('Please enter valid scores for both teams.');
        return;
      }

      const match = roundsData[currentRound - 1].matches[matchIdx];
      
      // Roll back previous score stats if updating
      if (match.completed) {
        recalculateAllStats();
      }

      match.score1 = score1;
      match.score2 = score2;
      match.completed = true;

      recalculateAllStats();
      renderLeaderboard();
      renderCurrentRound();
    }

    function recalculateAllStats() {
      // Reset stats
      players.forEach(p => {
        playerStats[p] = { wins: 0, points: 0, gamesPlayed: 0 };
      });

      // Recalculate based on completed matches
      roundsData.forEach(r => {
        r.matches.forEach(m => {
          if (m.completed) {
            const team1Win = m.score1 > m.score2;
            const team2Win = m.score2 > m.score1;

            m.team1.forEach(p => {
              playerStats[p].points += m.score1;
              playerStats[p].gamesPlayed += 1;
              if (team1Win) playerStats[p].wins += 1;
            });

            m.team2.forEach(p => {
              playerStats[p].points += m.score2;
              playerStats[p].gamesPlayed += 1;
              if (team2Win) playerStats[p].wins += 1;
            });
          }
        });
      });
    }

    function renderLeaderboard() {
      const sorted = [...players].sort((a, b) => {
        if (playerStats[b].wins !== playerStats[a].wins) {
          return playerStats[b].wins - playerStats[a].wins;
        }
        return playerStats[b].points - playerStats[a].points;
      });

      const body = document.getElementById('leaderboard-body');
      body.innerHTML = sorted.map((p, idx) => `
        <tr>
          <td>${idx + 1}</td>
          <td>${p}</td>
          <td>${playerStats[p].gamesPlayed} / 4</td>
          <td>${playerStats[p].wins}</td>
          <td>${playerStats[p].points}</td>
        </tr>
      `).join('');
    }

    function nextRound() {
      const currentMatches = roundsData[currentRound - 1].matches;
      const allCompleted = currentMatches.every(m => m.completed);

      if (!allCompleted) {
        alert('Please save scores for all matches in this round before continuing.');
        return;
      }

      if (currentRound < totalRounds) {
        currentRound++;
        renderCurrentRound();
      } else {
        alert('🎉 Tournament Complete!');
      }
    }

    function resetEvent() {
      if (confirm('Are you sure you want to reset the tournament?')) {
        document.getElementById('setup-section').style.display = 'block';
        document.getElementById('leaderboard-section').style.display = 'none';
        document.getElementById('matches-section').style.display = 'none';
      }
    }
  </script>
</body>
</html>
